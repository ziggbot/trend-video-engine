name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core zip

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Smoke e2e (mock mode, no secrets)
        run: npm run test:smoke
